<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DOCK PASS 하단 CTA 배너 소스</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@main/dist/web/variable/pretendardvariable.css');

/* 사이트 index.html :root 와 동일한 브랜드 토큰 */
:root{
  --navy-950:#020918;--navy-900:#031228;--navy-850:#071a34;--navy-800:#0e1c30;--navy-700:#162844;
  --beige-700:#a98254;--beige-500:#d7bf9f;--beige-400:#e3cdaf;--beige-100:#f1e6d7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#3a3a3a;font-family:'Pretendard Variable',Pretendard,sans-serif;
     letter-spacing:-.015em;display:flex;flex-direction:column;gap:40px;padding:40px;align-items:flex-start}

/* ── 공통: 네이비 무대 ───────────────────────────────────────────── */
.stage{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy-900) 0%,#0c2a51 62%,#123566 100%);color:#fff}

/* 우상단 골드 글로우 — 기존 CTA의 밋밋한 단색 그라데이션과 차별화 */
.stage::before{content:"";position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(227,205,175,.20) 0%,rgba(227,205,175,.07) 42%,transparent 70%);
  pointer-events:none}
/* 대각선 라이트 스윕 */
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.055) 47%,transparent 56%)}

/* 안쪽 골드 헤어라인 프레임 */
.frame{position:absolute;border:1px solid rgba(227,205,175,.22);border-radius:10px;pointer-events:none;z-index:3}

.content{position:relative;z-index:4;height:100%;display:flex}

/* ── 텍스트 ─────────────────────────────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(227,205,175,.45);
      border-radius:999px;color:var(--beige-400);font-weight:800;white-space:nowrap}
.chip .dot{width:5px;height:5px;border-radius:50%;background:var(--beige-400);flex:none}
.head{font-weight:800;line-height:1.26;letter-spacing:-.03em}
.head em{font-style:normal;color:var(--beige-400)}
.sub{color:#cfd9e8;font-weight:500}

/* 버튼 — 사이트 .btn--primary(베이지 그라데이션) 그대로 */
.cta-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,var(--beige-400),#f0d8b5);color:#14213a;font-weight:800;
  border-radius:12px;box-shadow:0 10px 26px rgba(215,191,159,.28)}
.cta-btn .arrow{font-weight:900}

/* ── 캠퍼스 메달리온 ────────────────────────────────────────────── */
.medals{display:flex}
.medal{display:flex;flex-direction:column;align-items:center}
.medal-ring{position:relative;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(227,205,175,.38);
  background:radial-gradient(circle at 50% 30%,rgba(227,205,175,.13),rgba(3,18,40,0) 72%);}
.medal-ring svg{color:var(--beige-400)}
.medal-label{color:var(--beige-100);font-weight:800;white-space:nowrap}

/* 실적 스트립 */
.stats{display:flex;align-items:center;color:#b9c6d9;font-weight:600;white-space:nowrap}
.stats b{color:#fff;font-weight:900}
.stats .num{color:var(--beige-400);font-weight:900}
.stats .bar{background:rgba(227,205,175,.3)}

/* 우측 글래스 패널 — 메달리온+실적을 한 덩어리로 묶어 오른쪽 여백을 채운다 */
.glass{background:rgba(255,255,255,.045);border:1px solid rgba(227,205,175,.16);
       border-radius:20px;backdrop-filter:blur(2px);display:flex;flex-direction:column;align-items:center}

/* 바닥에 깔리는 캠퍼스 스카이라인 — 좌우로 꽉 채워 '의도된 배경'으로 읽히게 한다 */
.skyline{position:absolute;left:0;bottom:0;width:100%;color:#fff;opacity:.06;pointer-events:none;z-index:1}

/* ══════════ PC 1080 × 500 ══════════ */
#pc{width:1080px;height:500px;border-radius:0}
#pc .frame{inset:18px}
#pc::before{width:620px;height:620px;right:-190px;top:-260px}
#pc .content{padding:52px 56px;align-items:center;justify-content:space-between;gap:36px}
#pc .left{max-width:560px}
#pc .chip{padding:8px 16px;font-size:14px;margin-bottom:20px}
#pc .head{font-size:44px;margin-bottom:16px}
#pc .sub{font-size:17px;line-height:1.62;margin-bottom:30px}
#pc .cta-btn{height:58px;padding:0 32px;font-size:18px}
#pc .glass{flex:none;padding:26px 30px 22px;gap:20px}
#pc .medals{gap:20px}
#pc .medal{gap:11px}
#pc .medal-ring{width:118px;height:118px}
#pc .medal-ring svg{width:64px;height:64px}
#pc .medal-label{font-size:15px}
#pc .stats{gap:12px;font-size:13.5px}
#pc .stats .bar{width:1px;height:12px}

/* ══════════ 모바일 720 × 600 ══════════ */
#mo{width:720px;height:600px}
#mo .frame{inset:20px}
#mo::before{width:600px;height:600px;right:-210px;top:-250px}
/* 세로형이라 스카이라인이 버튼 아래로 살짝만 보인다 — 크게 키워 큰 건물 밑동만 깔리게 */
#mo .skyline{width:170%;left:-35%;opacity:.05}
#mo .content{padding:44px 46px;flex-direction:column;align-items:center;text-align:center;justify-content:center;gap:0}
#mo .chip{padding:9px 18px;font-size:15.5px;margin-bottom:18px}
#mo .head{font-size:42px;margin-bottom:20px}
#mo .sub{font-size:17.5px;line-height:1.58;margin-bottom:22px}
#mo .glass{width:100%;padding:20px 18px 16px;gap:14px;margin-bottom:22px}
#mo .medals{gap:34px}
#mo .medal{gap:9px}
#mo .medal-ring{width:94px;height:94px}
#mo .medal-ring svg{width:50px;height:50px}
#mo .medal-label{font-size:14.5px}
#mo .stats{gap:12px;font-size:14px}
#mo .stats .bar{width:1px;height:12px}
#mo .cta-btn{height:66px;width:100%;font-size:21px}
</style>
</head>

            <!-- 연세대 언더우드관: 중앙 시계탑 + 넓은 본관 -->

      <div class="stats">
        <span>2026 최종합격 <span class="num">88명</span></span>
        <i class="bar"></i>
        <span>1차 합격 <span class="num">222명</span></span>

    </div>
  </div>
</div>
