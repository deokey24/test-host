<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@main/dist/web/variable/pretendardvariable.css');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:720px;overflow:hidden}
body{font-family:'Pretendard Variable',Pretendard,sans-serif;letter-spacing:-.02em;
  position:relative;background:linear-gradient(180deg,#390c0d 0%,#270707 100%)}
.bgimg{position:absolute;left:50%;transform:translateX(-50%);bottom:-40px;width:880px;
  opacity:.48;filter:blur(3px);
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 55%)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(57,12,13,.15) 0%,rgba(39,7,7,.55) 100%)}
.wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;padding:44px 54px 40px;text-align:center}
.eyebrow{display:flex;align-items:center;gap:24px;color:#fff;font-size:50px;font-weight:700}
.eyebrow::before,.eyebrow::after{content:'';width:80px;height:3px;background:rgba(255,255,255,.55)}
h1{color:#fff;font-weight:900;line-height:1.06}
h1 .u{display:block;font-size:158px;color:#ffffff;text-shadow:0 10px 30px rgba(0,0,0,.45)}
h1 .s{display:block;font-size:108px;color:#f7707c;margin-top:10px;text-shadow:0 8px 24px rgba(0,0,0,.4)}
.box{background:#fff;border-radius:18px;padding:20px 56px;color:#540c0d;
  font-size:48px;font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.logo-row{display:flex;align-items:center;gap:18px;background:#390c0d;
  border:1.5px solid rgba(255,255,255,.07);border-radius:18px;padding:12px 30px 12px 18px}
.logo-clip{height:66px;overflow:hidden}
.logo-clip img{display:block;height:87px}
.logo-sub{font-size:36px;font-weight:600;color:rgba(255,255,255,.92)}
</style></head>
<body>
<img class="bgimg" src="../crops/top3-building.png" alt="">
<div class="shade"></div>
<div class="wrap">
  <div class="eyebrow">실전처럼, 고려대에서!</div>
  <h1><span class="u">고려대</span><span class="s">대관 모의논술</span></h1>
  <div class="box">11월 초 시행 예정</div>
  <div class="logo-row">
    <div class="logo-clip"><img src="../crops/top3-logo.png" alt=""></div>
    <div class="logo-sub">독편사편입논술학원</div>
  </div>
</div>
</body></html>
