<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@main/dist/web/variable/pretendardvariable.css');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:720px;overflow:hidden}
body{font-family:'Pretendard Variable',Pretendard,sans-serif;letter-spacing:-.02em;
  background:linear-gradient(180deg,#ffffff 0%,#f2f6fc 62%,#e6eefb 100%)}
.wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;padding:36px 54px 40px;text-align:center}
.logo-row{display:flex;align-items:center;gap:20px}
.logo-mark{display:block;height:72px}
.logo-sub{font-size:37px;font-weight:700;color:#0a1654;letter-spacing:-.01em}
.badge{display:inline-flex;align-items:center;gap:16px;background:#ffffff;
  border:2px solid #cfe0ff;border-radius:999px;padding:10px 38px;
  color:#0c71ff;font-size:37px;font-weight:800;
  box-shadow:0 10px 26px rgba(12,113,255,.14)}
.badge .stars{font-size:26px;letter-spacing:5px;transform:translateY(-2px)}
h1{font-size:84px;font-weight:900;color:#0a1654;line-height:1.16}
h1 .blue{color:#0059ff}
.info{width:100%;background:#f0f4fa;border:1.5px solid #e2e9f4;border-radius:26px;
  padding:16px 24px;display:flex;flex-direction:column}
.info div{font-size:40px;font-weight:700;color:#1c2b57;padding:9px 0}
.info div+div{border-top:2px solid #dde5f1}
.info b{font-weight:800;color:#0a1654}
.cta{width:100%;background:linear-gradient(180deg,#1a7dff,#0c66f2);color:#fff;
  font-size:45px;font-weight:800;border-radius:999px;padding:27px 0;
  box-shadow:0 12px 28px rgba(12,113,255,.28)}
.cta .arr{font-weight:700;margin-left:10px}
</style></head>
<body>
<div class="wrap">
  <div class="logo-row">
    <img class="logo-mark" src="../crops/top1-mark.png" alt="">
    <div class="logo-sub">독편사편입논술학원</div>
  </div>
  <div class="badge"><span class="stars">★★★★★</span>마지막 최종 충원 기간</div>
  <h1>연고대 논술 대비<br><span class="blue">8월 신규반 안내</span></h1>
  <div class="info">
    <div><b>방학특강반 D반</b></div>
    <div>개강 <b>8월 1일(토)</b></div>
    <div>화 13-16시, 토 14-17시</div>
  </div>
  <div class="cta">자세한 내용 확인하기<span class="arr">›</span></div>
</div>
</body></html>
