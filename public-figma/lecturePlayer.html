<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><script src="analytics.js?v=20261015"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의 수강 · 독편사 DOCK PASS</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<link rel="stylesheet" href="style.css?v=20261015e">
</head>
<body data-page="lecturePlayer" class="lp2-page">

  <div class="lp2-topbar">
    <a class="lp2-back" id="lpBackBtn" href="vod.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      강의 목록
    </a>
    <div class="lp2-topbar-title">
      <span class="lp2-topbar-course" id="lpTopbarCourse"></span>
      <span class="lp2-topbar-lecture" id="lpTopbarLecture"></span>
    </div>
  </div>

  <div class="lp2-layout">

    <div class="lp2-main">
      <!-- 커스텀 플레이어: 전체화면은 video가 아니라 이 래퍼에 걸어 워터마크·오버레이가 같이 커지게 한다 -->
      <div class="lp-video-wrap" id="lpVideoWrap">
        <video id="lpVideo" playsinline controlsList="nodownload noremoteplayback" disablePictureInPicture disableRemotePlayback></video>

        <button type="button" class="lp-big-play" id="lpBigPlay" aria-label="재생">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        </button>
        <div class="lp-hint" id="lpHint" aria-live="polite"></div>

        <div class="lp-overlay lp-focus-overlay" id="lpFocusOverlay" role="button" tabindex="0">
          <p>강의 화면으로 돌아오면 이어서 재생할 수 있습니다</p>
          <span class="lp-overlay-sub">화면을 클릭하면 재생됩니다</span>
        </div>
        <div class="lp-blackout" id="lpBlackout"></div>

        <div class="lp-overlay lp-end-overlay" id="lpEndOverlay">
          <p class="lp-end-title" id="lpEndTitle"></p>
          <span class="lp-overlay-sub" id="lpEndDesc"></span>
          <div class="lp-end-actions">
            <button type="button" class="lp-end-btn" id="lpEndCancel">취소</button>
            <button type="button" class="lp-end-btn lp-end-btn--primary" id="lpEndNow">바로 보기</button>
          </div>
        </div>

        <div class="lp-controls" id="lpControls">
          <div class="lp-seek" id="lpSeek" role="slider" aria-label="재생 위치" aria-valuemin="0">
            <div class="lp-seek-track">
              <div class="lp-seek-buffer" id="lpSeekBuffer"></div>
              <div class="lp-seek-played" id="lpSeekPlayed"></div>
            </div>
            <div class="lp-seek-thumb" id="lpSeekThumb"></div>
          </div>
          <div class="lp-controls-row">
            <button type="button" class="lp-ctrl lp-ctrl--play" id="lpPlayBtn" aria-label="재생 (K)">
              <svg class="ico-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
              <svg class="ico-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>
            </button>
            <button type="button" class="lp-ctrl lp-ctrl--skip" id="lpRewindBtn" aria-label="10초 뒤로 (←)">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 3 3 9 9 9"/></svg><span class="lp-skip-num">10</span>
            </button>
            <button type="button" class="lp-ctrl lp-ctrl--skip" id="lpForwardBtn" aria-label="10초 앞으로 (→)">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg><span class="lp-skip-num">10</span>
            </button>
            <div class="lp-volume">
              <button type="button" class="lp-ctrl lp-ctrl--mute" id="lpMuteBtn" aria-label="음소거 (M)">
                <svg class="ico-vol" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
                <svg class="ico-muted" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
              </button>
              <input type="range" class="lp-volume-range" id="lpVolume" min="0" max="1" step="0.05" value="1" aria-label="볼륨">
            </div>
            <span class="lp-time" id="lpTime">0:00 / 0:00</span>
            <span class="lp-controls-spacer"></span>
            <div class="lp-rate">
              <button type="button" class="lp-ctrl lp-ctrl--rate" id="lpRateBtn" aria-label="재생 속도 (, .)" aria-haspopup="menu" aria-expanded="false">1x</button>
              <div class="lp-rate-menu" id="lpRateMenu" role="menu"></div>
            </div>
            <button type="button" class="lp-ctrl lp-ctrl--fs" id="lpFullscreenBtn" aria-label="전체화면 (F)">
              <svg class="ico-fs" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 9 4 4 9 4"/><polyline points="20 9 20 4 15 4"/><polyline points="4 15 4 20 9 20"/><polyline points="20 15 20 20 15 20"/></svg>
              <svg class="ico-fs-exit" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 4 9 9 4 9"/><polyline points="15 4 15 9 20 9"/><polyline points="9 20 9 15 4 15"/><polyline points="15 20 15 15 20 15"/></svg>
            </button>
          </div>
        </div>
      </div>
      <h2 id="lpLectureTitle" class="lp-lecture-title"></h2>

      <div class="vod-info-card lp2-materials-card">
        <div class="cd-panel-title">수업 자료</div>
        <div id="lpMaterialsList" class="lp2-materials-list"></div>
      </div>
    </div>

    <div class="lp2-side">
      <button type="button" class="lp2-next-btn" id="lpNextBtn">
        다음 강의로
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <div class="vod-info-card lp2-tabs-card">
        <div class="lp2-tabs" id="lpTabs">
          <button type="button" data-tab="lpTabCurriculum" class="active">커리큘럼</button>
          <button type="button" data-tab="lpTabContent">강의 내용</button>
        </div>
        <div class="lp2-tabs-body">
          <div id="lpTabCurriculum">
            <ul class="curriculum-list lp-curriculum-list" id="lpCurriculumList"></ul>
          </div>
          <div id="lpTabContent" style="display:none;">
            <div id="lpLectureContent" class="cd-markdown"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

<script src="site-content.js?v=20261015d"></script>
</body>
</html>
