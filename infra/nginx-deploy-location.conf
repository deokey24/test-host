
    # GitHub push 웹훅 — deploy-hook.js(127.0.0.1:3999)가 X-Hub-Signature-256을 검증한 뒤 deploy.sh를 실행한다.
    # 본 앱(3000)과 다른 포트로 보내는 이유: 배포가 pm2 reload dockteacher를 하므로 같은 프로세스면 요청이 끊긴다.
    location = /_deploy {
        proxy_pass http://127.0.0.1:3999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
